[package]
name = "fre-jit-bakeoff"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[dependencies]
fre = { path = "../../../crates/fre" }
fre-jit-aarch64 = { path = "../../../crates/fre-jit-aarch64" }
fre-jit-cache = { path = "../../../crates/fre-jit-cache" }
fre-jit-runtime = { path = "../../../crates/fre-jit-runtime" }
fre-kernel-ir = { path = "../../../crates/fre-kernel-ir" }
fre-kernels = { path = "../../../crates/fre-kernels" }
memchr = { version = "=2.8.3", default-features = false }
regex = { version = "=1.12.4", features = ["logging", "perf-dfa-full"] }
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
