[workspace]

[package]
name = "fre-search-tag25-static-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"
publish = false
build = "build.rs"

[dependencies]
fre-aot-static-runtime = { path = "../../../crates/fre-aot-static-runtime", default-features = false, features = ["search-span-qualification-private-v1"] }

[build-dependencies]
fre = { path = "../../../crates/fre", default-features = false }
fre-aot-compiler = { path = "../../../crates/fre-aot-compiler" }
fre-aot-search-contract = { path = "../../../crates/fre-aot-search-contract" }
fre-kernel-ir = { path = "../../../crates/fre-kernel-ir" }

[[bin]]
name = "fre-search-tag25-static-smoke"
path = "src/main.rs"

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
