[workspace]

[package]
name = "fre-search-v26-synthetic-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
fre-jit-aarch64 = { path = "../../../../crates/fre-jit-aarch64" }
fre-jit-runtime = { path = "../../../../crates/fre-jit-runtime" }
fre-kernel-ir = { path = "../../../../crates/fre-kernel-ir" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[build-dependencies]
sha2 = "=0.10.9"

[[bin]]
name = "fre-search-v26-synthetic-runner"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
