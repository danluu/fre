[workspace]

[package]
name = "fre-search-tag30-qualification-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"
publish = false
build = "build.rs"

[dependencies]
fre = { path = "../../../crates/fre", default-features = false, features = ["explicit-search-span-aot"] }
fre-aot-static-runtime = { path = "../../../crates/fre-aot-static-runtime", default-features = false, features = ["search-span-qualification-private-v1"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
libc = "=0.2.186"

[build-dependencies]
fre = { path = "../../../crates/fre", default-features = false }
fre-aot-compiler = { path = "../../../crates/fre-aot-compiler" }
fre-jit-aarch64 = { path = "../../../crates/fre-jit-aarch64" }
fre-kernel-ir = { path = "../../../crates/fre-kernel-ir" }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[[bin]]
name = "fre-search-tag30-qualification-runner"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
