[workspace]

[package]
name = "fre-external-regex-materializer"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
fre = { path = "../../../../crates/fre", default-features = false }
fre-syntax = { path = "../../../../crates/fre-syntax" }
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std", "unicode"] }
rust-regex-conformance = { path = "../../../../tools/rust-regex-conformance" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
toml = "=1.1.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
