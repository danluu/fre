[package]
name = "fre-aot-rebar-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Job-specialized static general-AOT runner for public Rebar models"
publish = false
build = "build.rs"

[[bin]]
name = "fre-aot-rebar-runner"
path = "src/main.rs"

[dependencies]
bstr = { version = "=1.12.1", default-features = false, features = ["std"] }
fre-aot-regex = { path = "../../crates/fre-aot-regex" }
fre-aot-regex-runtime = { path = "../../crates/fre-aot-regex-runtime" }
fre-lower = { path = "../../crates/fre-lower" }
fre-syntax = { path = "../../crates/fre-syntax" }
regex-automata = "=0.4.15"

[build-dependencies]
fre-aot-regex = { path = "../../crates/fre-aot-regex" }
fre-lower = { path = "../../crates/fre-lower" }
fre-syntax = { path = "../../crates/fre-syntax" }

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
