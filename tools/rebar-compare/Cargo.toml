[package]
name = "rebar-compare"
version.workspace = true
description = "Exact semantic comparator and receipt generator for FRE Rebar qualification"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
static-dispatch = ["fre/static-dispatch"]
static-dispatch-arm-41-d84 = [
    "static-dispatch",
    "fre/static-dispatch-arm-41-d84",
]

[lints]
workspace = true

[dependencies]
bstr = { version = "=1.12.1", default-features = false, features = ["std"] }
fre = { path = "../../crates/fre" }
libc = "=0.2.186"
rebar-expand = { path = "../rebar-expand" }
regex = { version = "=1.12.4", features = ["logging", "perf-dfa-full"] }
regex-automata = "=0.4.14"
regex-lite = "=0.1.9"
regex-syntax = "=0.8.11"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
toml = "=1.1.2"

[dev-dependencies]
fre-automata = { path = "../../crates/fre-automata" }
fre-lower = { path = "../../crates/fre-lower" }
