[package]
name = "fre-ripgrep-aot-thin"
version.workspace = true
description = "Precompiled general-AOT registry for the ripgrep comparison adapter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
fre-aot-regex = { path = "../../crates/fre-aot-regex" }
fre-aot-regex-runtime = { path = "../../crates/fre-aot-regex-runtime" }
sha2 = "0.10.9"

[build-dependencies]
fre-aot-regex = { path = "../../crates/fre-aot-regex" }
fre-lower = { path = "../../crates/fre-lower" }
fre-syntax = { path = "../../crates/fre-syntax" }
sha2 = "0.10.9"

[dev-dependencies]
fre-lower = { path = "../../crates/fre-lower" }
fre-syntax = { path = "../../crates/fre-syntax" }

[lints.clippy]
pedantic = "warn"

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
