[workspace]
resolver = "3"
members = [
    "crates/fre",
    "crates/fre-aggregate",
    "crates/fre-automata",
    "crates/fre-capture-lab",
    "crates/fre-capi",
    "crates/fre-conformance",
    "crates/fre-iterator-lab",
    "crates/fre-kernel-ir",
    "crates/fre-kernels",
    "crates/fre-jit-aarch64",
    "crates/fre-jit-cache",
    "crates/fre-jit-runtime",
    "crates/fre-jit-x86_64",
    "crates/fre-lower",
    "crates/fre-re2-syntax",
    "crates/fre-reference",
    "crates/fre-required-literal-lab",
    "crates/fre-syntax",
    "tools/rebar-expand",
    "tools/rebar-compare",
    "tools/rebar-manifest",
    "tools/fre-holdout",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"

[workspace.lints.rust]
# Crates that promise to contain no unsafe code also state `forbid` at their
# crate roots. The workspace default is `deny` so a crate can make a narrowly
# scoped, reasoned exception for an audited primitive.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.bench]
debug = 1
lto = "thin"
