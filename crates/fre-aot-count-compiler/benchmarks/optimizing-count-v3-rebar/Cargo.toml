[workspace]

[package]
name = "fre-optimizing-count-v3-rebar"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"
publish = false
build = "build.rs"

[dependencies]
fre = { path = "../../../fre", default-features = false, features = ["count-v3-aot-qualification-private"] }
fre-aot-static-runtime = { path = "../../../fre-aot-static-runtime", default-features = false, features = ["count-v3-qualification-private"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[build-dependencies]
fre = { path = "../../../fre", default-features = false }
fre-aot-aarch64 = { path = "../../../fre-aot-aarch64" }
fre-aot-count-compiler = { path = "../.." }
fre-aot-count-contract = { path = "../../../fre-aot-count-contract" }
fre-aot-optimizer = { path = "../../../fre-aot-optimizer" }
fre-kernel-ir = { path = "../../../fre-kernel-ir" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[[bin]]
name = "fre-optimizing-count-v3-rebar"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
