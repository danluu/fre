[package]
name = "fre-jit-runtime"
version.workspace = true
description = "Narrow executable-memory and native-call boundary for FRE JIT images"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Exposes only the doc-hidden ABI canary used by source-bound hardware
# qualification. Production users have no reason to enable it.
sve-hardware-qualification = []

[dependencies]
fre-jit-aarch64 = { path = "../fre-jit-aarch64" }
fre-kernel-ir = { path = "../fre-kernel-ir" }
fre-kernels = { path = "../fre-kernels" }
fre-target-features = { path = "../fre-target-features" }
libc = "=0.2.186"

[dev-dependencies]
fre = { path = "../fre", default-features = false }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
