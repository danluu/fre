[package]
name = "fre"
version.workspace = true
description = "Facade for the FRE bounded native regular-expression engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
static-dispatch = ["fre-kernels/static-dispatch"]
static-dispatch-arm-41-d84 = [
    "static-dispatch",
    "fre-kernels/static-dispatch-arm-41-d84",
]

[dependencies]
fre-aggregate = { path = "../fre-aggregate" }
fre-automata = { path = "../fre-automata" }
fre-capture-lab = { path = "../fre-capture-lab" }
fre-exact-alloc = { path = "../fre-exact-alloc" }
fre-jit-aarch64 = { path = "../fre-jit-aarch64" }
fre-jit-runtime = { path = "../fre-jit-runtime" }
fre-kernel-ir = { path = "../fre-kernel-ir" }
fre-kernels = { path = "../fre-kernels" }
fre-lower = { path = "../fre-lower" }
fre-syntax = { path = "../fre-syntax" }
memchr = "=2.8.3"
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
regex = { version = "=1.12.4", features = ["logging", "perf-dfa-full"] }
regex-automata = "=0.4.14"
stats_alloc = "=0.1.10"

[[bench]]
name = "portable_baseline"
harness = false

[lints]
workspace = true
