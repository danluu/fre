[package]
name = "fre-kernels"
version.workspace = true
description = "Bounded operation-specific search kernels for FRE"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
static-dispatch = ["fre-simd-kernels/static-dispatch"]
static-dispatch-arm-41-d84 = [
    "static-dispatch",
    "fre-simd-kernels/static-dispatch-arm-41-d84",
]

[dependencies]
aho-corasick = "=1.1.4"
fre-exact-alloc = { path = "../fre-exact-alloc" }
fre-kernel-ir = { path = "../fre-kernel-ir" }
fre-simd-kernels = { path = "../fre-simd-kernels" }
memchr = "=2.8.3"

[dev-dependencies]
regex = { version = "=1.12.4", features = ["logging", "perf-dfa-full"] }
regex-automata = "=0.4.15"
stats_alloc = "=0.1.10"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
