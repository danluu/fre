[package]
name = "fre-kernels"
version.workspace = true
description = "Bounded operation-specific search kernels for FRE"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
aho-corasick = "=1.1.4"
memchr = "=2.8.3"

[dev-dependencies]
regex = { version = "=1.12.4", features = ["logging", "perf-dfa-full"] }

[lints.rust]
# The library contains one function-local, audited exact-layout allocation
# primitive. This is the only newly introduced package-local exception; the
# metadata boundary check pins every intentional exception and non-library
# target.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
