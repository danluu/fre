[package]
name = "fre-automata"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Bounded prioritized automata and a portable capture-free search floor for FRE"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
static-dispatch = ["fre-simd-kernels/static-dispatch"]
static-dispatch-arm-41-d84 = [
    "static-dispatch",
    "fre-simd-kernels/static-dispatch-arm-41-d84",
]

[dependencies]
fre-exact-alloc = { path = "../fre-exact-alloc" }
fre-simd-kernels = { path = "../fre-simd-kernels" }
memchr = "=2.8.3"
regex-syntax = { version = "=0.8.11", default-features = false, features = ["unicode-perl"] }

[dev-dependencies]
stats_alloc = "=0.1.10"

[lints]
workspace = true
