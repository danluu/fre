[package]
name = "fre-aot-regex-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Stable C runtime boundary for general FRE AOT regex objects"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
fre-aot-regex = { path = "../fre-aot-regex" }
fre-exact-alloc = { path = "../fre-exact-alloc" }

[dev-dependencies]
regex = { version = "=1.12.4", features = ["perf-dfa-full"] }
stats_alloc = "=0.1.10"

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
