[package]
name = "fre-aot-compiler"
version.workspace = true
description = "General optimizing AOT regex compiler plus authenticated legacy FRE artifacts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autoexamples = false

[[example]]
name = "emit_linux_search_span_source_candidate"
path = "examples/emit_linux_search_span_source_candidate.rs"

[[example]]
name = "emit_search_span_source_candidate"
path = "examples/emit_search_span_source_candidate.rs"

[[example]]
name = "compile_general_aot"
path = "examples/compile_general_aot.rs"

[dependencies]
fre = { path = "../fre", default-features = false }
fre-aot-aarch64 = { path = "../fre-aot-aarch64" }
fre-aot-elf = { path = "../fre-aot-elf" }
fre-aot-macho = { path = "../fre-aot-macho" }
fre-aot-regex = { path = "../fre-aot-regex" }
fre-aot-search-contract = { path = "../fre-aot-search-contract" }
fre-jit-aarch64 = { path = "../fre-jit-aarch64" }
fre-kernel-ir = { path = "../fre-kernel-ir" }
fre-syntax = { path = "../fre-syntax" }
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std", "unicode"] }
sha2 = "=0.10.9"

[lints]
workspace = true
