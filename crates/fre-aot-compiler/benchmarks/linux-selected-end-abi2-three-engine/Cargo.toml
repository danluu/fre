[workspace]

[package]
name = "fre-aot-linux-selected-end-abi2-three-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"
publish = false
build = "build.rs"

[dependencies]
fre-aot-static-runtime = { path = "../../../fre-aot-static-runtime", features = ["selected-end-qualification-private-v2"] }
fre-jit-aarch64 = { path = "../../../fre-jit-aarch64" }
fre-jit-runtime = { path = "../../../fre-jit-runtime" }
fre-kernel-ir = { path = "../../../fre-kernel-ir" }
fre-kernels = { path = "../../../fre-kernels" }
fre-target-features = { path = "../../../fre-target-features" }

[build-dependencies]
fre = { path = "../../../fre", default-features = false }
fre-aot-compiler = { path = "../../../fre-aot-compiler" }

[[bin]]
name = "fre-aot-linux-selected-end-abi2-three-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "none"

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
