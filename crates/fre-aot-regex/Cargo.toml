[package]
name = "fre-aot-regex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "General self-contained optimizing AOT compiler for FRE automata"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
fre-automata = { path = "../fre-automata" }
fre-capture-lab = { path = "../fre-capture-lab" }
fre-kernels = { path = "../fre-kernels" }
fre-lower = { path = "../fre-lower" }
fre-simd-kernels = { path = "../fre-simd-kernels" }
fre-syntax = { path = "../fre-syntax" }
memchr = "2.7"
sha2 = "0.10.9"

[dev-dependencies]
# This is the official signed 1.13.1 tag object. Its distinct source keeps this
# comparison oracle independent of the workspace's frozen Rebar 1.12.4 profile.
regex = { git = "https://github.com/rust-lang/regex.git", rev = "7c28ee4dc4aef53571c96757f4825c51ac0c3d44", features = ["perf-dfa-full"] }
regex-automata = "=0.4.14"
stats_alloc = "=0.1.10"

[lints]
workspace = true
